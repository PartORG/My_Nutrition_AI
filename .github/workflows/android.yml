# Builds the release APK and publishes it as GitHub Release v<pubspec version>.
# Runs on push to main; does nothing if that version was already released, so bump
# `version:` in pubspec.yaml to ship a new one.
#
# One-time setup (and once per data version, lib/data/nutri_db.dart nutriDataVersion):
#   * Release "data-<nutriDataVersion>" with what the app downloads on first run, each gzipped. Public:
#     Gemma's terms allow redistribution with its notice (assets/licenses/models.txt ships in the APK):
#       gzip -k assets/nutri.db assets/health.db assets/models/embeddinggemma*
#       gh release create data-6 --prerelease --title "Food data 6 (downloaded by the app)" \
#         assets/nutri.db.gz assets/health.db.gz assets/models/embeddinggemma*.gz
#   * Secrets: ANDROID_KEYSTORE_BASE64 (`base64 -w0 upload.jks`), ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: android-release
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          v=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      # The app downloads its food data on first run: never ship one whose data release isn't up.
      - if: steps.version.outputs.exists != 'true'
        run: |
          v=$(grep -oP 'const nutriDataVersion = \K\d+' lib/data/nutri_db.dart)
          have=$(gh release view "data-$v" --json assets -q '.assets[].name' | sort | tr '\n' ' ')
          for f in embeddinggemma-300M_seq256.tflite.gz embeddinggemma_sentencepiece.model.gz health.db.gz nutri.db.gz; do
            case " $have" in *" $f "*) ;; *) echo "release data-$v lacks $f: upload it"; exit 1 ;; esac
          done

      - if: steps.version.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle wrapper, dependencies and build cache (org.gradle.caching): ~1.5 min of
      # downloads per run otherwise. Not the NDK: Gradle fetches it in ~15 s, a cache restore is no faster.
      - if: steps.version.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v6

      - if: steps.version.outputs.exists != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - if: steps.version.outputs.exists != 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - if: steps.version.outputs.exists != 'true'
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define=DEV_BILLING=true  # shortcut: dev tier switch until RevenueCat is set up
          mv build/app/outputs/flutter-apk/app-release.apk "my-nutrition-ai-${{ steps.version.outputs.tag }}.apk"

      - if: steps.version.outputs.exists != 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "my-nutrition-ai-${{ steps.version.outputs.tag }}.apk" \
            --target "$GITHUB_SHA" --title "My Nutrition AI ${{ steps.version.outputs.tag }}" --generate-notes
