publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_gemma: ^1.11.3
  flutter_gemma_embeddings: ^2.2.1
  flutter_gemma_litertlm: ^1.8.5
  flutter_local_notifications: ^22.3.1
