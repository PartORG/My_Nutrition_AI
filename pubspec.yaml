name: myfoodmind
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.1
  crypto: ^3.0.7
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_gemma: ^1.11.3
  flutter_gemma_embeddings: ^2.2.1
  flutter_gemma_litertlm: ^1.8.5
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  intl: ^0.20.2
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  purchases_flutter: ^10.14.0
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  sqlite3: ^3.5.2
  tflite_flutter: ^0.12.1
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/nutri.db
    - assets/icons/icon_chat.png
    - assets/fonts/
    - assets/licenses/
    # EmbeddingGemma (Gemma terms; gated on Hugging Face): copy
    # embeddinggemma-300M_seq256.tflite + embeddinggemma_sentencepiece.model into
    # assets/models/ before building. Git-ignored (179 MB is over GitHub's limit).
    # Must live under assets/: flutter_gemma looks bundled models up as assets/<path>.
    - assets/models/
