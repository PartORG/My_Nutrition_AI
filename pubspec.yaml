name: myfoodmind
description: "A new Flutter project."
publish_to: 'none'
version: 0.25.4+32

environment:
  sdk: ^3.12.2

dependencies:
  background_downloader: ^9.5.9
  camera: ^0.12.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dynamic_color: ^2.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_edge_ai: ^2.1.3
  flutter_edge_ai_embeddings: ^2.2.2
  flutter_edge_ai_litertlm: ^1.11.3
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  google_sign_in: ^7.2.0
  health: ^13.3.2
  home_widget: ^0.10.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  local_auth: ^3.0.2
  material_ui: ^1.6.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  purchases_flutter: ^10.14.0
  record: ^7.1.2
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  sqlite3: ^3.5.2
  tflite_flutter: ^0.12.1
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans  # OFL 1.1 (assets/fonts/OFL-PlusJakartaSans.txt); no Cyrillic, so Onest is its fallback
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Onest  # OFL 1.1 (assets/fonts/OFL-Onest.txt); static instances of the variable font
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
  assets:
    - assets/icons/icon_chat.png
    - assets/icons/eva_cutout.png
    - assets/icons/eva_eating.png
    - assets/icons/eva_sleeping.png
    - assets/icons/eva_waving.png
    - assets/icons/eva_sitting.png
    - assets/icons/eva_thinking.png
    - assets/icons/eva_camera.png
    - assets/fonts/
    - assets/licenses/
    # nutri.db, health.db and EmbeddingGemma are downloaded on first run (DataDownload in lib/app_state.dart), so
    # only the small detector models ship; listed one by one, as assets/models/ may hold the embedder locally.
    - assets/models/efficientdet_lite0.tflite
    - assets/models/yolox_tiny_food.tflite
    # The food detector's labels in class order (assets/models/yolox_tiny_food.tflite, tool/detector_export.py).
    - db/detector_labels.tsv
